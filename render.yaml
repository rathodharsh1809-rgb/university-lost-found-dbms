services:
  - type: web
    name: university-lost-found-dbms
    env: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn wsgi:app
    envVars:
      - key: FLASK_DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ADMIN_PASSWORD
        value: admin@123
