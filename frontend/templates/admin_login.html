{% extends "base.html" %}

{% block title %}Admin Access | University Lost & Found{% endblock %}

{% block content %}
<div class="login-wrapper">
    <div class="card login-card">
        <div class="login-header">
            <div class="login-symbol">
                <svg class="svg-header" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <rect x="3" y="11" width="18" height="11" rx="2" ry="2"/>
                    <path d="M7 11V7a5 5 0 0 1 10 0v4"/>
                </svg>
            </div>
            <h1 class="login-title">Admin Access</h1>
            <p class="login-subtitle">Sign in to access the Lost & Found Department dashboard.</p>
        </div>

        <form action="{{ url_for('routes.admin_login') }}" method="POST" class="styled-form">
            <div class="form-group">
                <label for="password" class="form-label">Admin Password</label>
                <div class="password-input-group">
                    <input type="password" id="password" name="password" class="form-control" placeholder="Enter admin password" required autofocus>
                    <button type="button" class="btn-toggle-password" id="togglePassword" title="Toggle password visibility">
                        <svg id="eyeIcon" class="svg-inline" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                            <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                            <circle cx="12" cy="12" r="3"/>
                        </svg>
                    </button>
                </div>
            </div>

            <div class="form-actions login-actions">
                <button type="submit" class="btn btn-primary btn-lg btn-block">
                    <svg class="svg-btn" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M15 3h4a2 2 0 0 1 2 2v14a2 2 0 0 1-2 2h-4"/>
                        <polyline points="10 17 15 12 10 7"/>
                        <line x1="15" y1="12" x2="3" y2="12"/>
                    </svg>
                    Sign In
                </button>
                <a href="{{ url_for('routes.browse') }}" class="btn btn-secondary btn-block" style="text-align: center;">
                    Back to Browse
                </a>
            </div>
        </form>
    </div>
</div>

<script>
    document.addEventListener('DOMContentLoaded', () => {
        const toggleBtn = document.getElementById('togglePassword');
        const passwordInput = document.getElementById('password');
        const eyeIcon = document.getElementById('eyeIcon');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                
                if (isPassword) {
                    eyeIcon.innerHTML = `
                        <path d="M17.94 17.94A10.07 10.07 0 0 1 12 20c-7 0-11-8-11-8a18.45 18.45 0 0 1 5.06-5.94M9.9 4.24A9.12 9.12 0 0 1 12 4c7 0 11 8 11 8a18.5 18.5 0 0 1-2.16 3.19m-6.72-1.07a3 3 0 1 1-4.24-4.24"/>
                        <line x1="1" y1="1" x2="23" y2="23"/>
                    `;
                } else {
                    eyeIcon.innerHTML = `
                        <path d="M1 12s4-8 11-8 11 8 11 8-4 8-11 8-11-8-11-8z"/>
                        <circle cx="12" cy="12" r="3"/>
                    `;
                }
            });
        }
    });
</script>
{% endblock %}
