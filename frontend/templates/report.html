{% extends "base.html" %}

{% block title %}Report Lost Item | University Lost & Found{% endblock %}

{% block content %}
<div class="page-header">
    <div>
        <h1 class="page-title">Report Lost Item</h1>
        <p class="page-subtitle">Submit details of an item you have lost.</p>
    </div>
</div>

<div class="form-container">
    <div class="card form-card">
        <form action="{{ url_for('routes.report') }}" method="POST" class="styled-form">
            
            <div class="form-group">
                <label for="item_name" class="form-label">Item Name <span class="required">*</span></label>
                <input type="text" id="item_name" name="item_name" class="form-control" placeholder="e.g. DBMS Book" required autofocus>
                <span class="form-hint">Brief title of the lost article.</span>
            </div>

            <div class="form-group">
                <label for="category" class="form-label">Category</label>
                <select id="category" name="category" class="form-control">
                    <option value="Books & Stationery">Books & Stationery</option>
                    <option value="Electronics">Electronics</option>
                    <option value="Personal Belongings">Personal Belongings</option>
                    <option value="Documents & IDs">Documents & IDs</option>
                    <option value="Other">Other</option>
                </select>
            </div>

            <div class="form-group">
                <label for="description" class="form-label">Description</label>
                <textarea id="description" name="description" class="form-control" rows="3" placeholder="e.g. Blue cover textbook with notes inside."></textarea>
                <span class="form-hint">Provide identifying features, brand details, or markings.</span>
            </div>

            <div class="form-row">
                <div class="form-group col-half">
                    <label for="lost_location" class="form-label">Lost Location <span class="required">*</span></label>
                    <input type="text" id="lost_location" name="lost_location" class="form-control" placeholder="e.g. Computer Lab 3" required>
                </div>

                <div class="form-group col-half">
                    <label for="lost_date" class="form-label">Lost Date <span class="required">*</span></label>
                    <input type="text" id="lost_date" name="lost_date" class="form-control" value="25-08-2026" placeholder="DD-MM-YYYY" required>
                </div>
            </div>

            <div class="form-actions">
                <button type="submit" class="btn btn-primary btn-lg">
                    Submit Report
                </button>
                <a href="{{ url_for('routes.my_reports') }}" class="btn btn-secondary">Cancel</a>
            </div>
        </form>
    </div>
</div>
{% endblock %}
